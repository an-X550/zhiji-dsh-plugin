# The zhiji Bundle registers four embedded runtime Skills.
# DSH base already provides the skills registry, skill catalog/tool, and Web
# user-invocation surface; this package contributes no host Tool or UI row.
- insert:
    - id: zhiji-daily-review-skill
      name: zhiji-dsh-plugin
      inject: [skills]
    - id: zhiji-weekly-review-skill
      name: zhiji-dsh-plugin
      inject: [skills]
    - id: zhiji-monthly-review-skill
      name: zhiji-dsh-plugin
      inject: [skills]
    - id: zhiji-project-review-skill
      name: zhiji-dsh-plugin
      inject: [skills]
